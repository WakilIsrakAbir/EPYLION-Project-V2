<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abir Group - Login & Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f4f5f7;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }

        .auth-container {
            background: white;
            padding: 2.5rem 2rem;
            border-radius: 8px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 400px;
        }

        .input-field {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            outline: none;
            margin-bottom: 1rem;
            font-size: 14px;
            color: #374151;
            background-color: #f9fafb;
            transition: all 0.2s;
        }

        .input-field:focus {
            border-color: #3b82f6;
            background-color: white;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .btn-primary {
            width: 100%;
            padding: 0.75rem;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-primary:hover {
            background-color: #2563eb;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-primary:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
            transform: none;
        }

        .toggle-link {
            color: #3b82f6;
            cursor: pointer;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            transition: color 0.2s;
        }

        .toggle-link:hover {
            color: #1d4ed8;
            text-decoration: underline;
        }

        #toast {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            padding: 1rem 1.5rem;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            transform: translateY(-20px);
            pointer-events: none;
            z-index: 50;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .toast-show {
            opacity: 1 !important;
            transform: translateY(0) !important;
        }

        .toast-success {
            background-color: #10b981;
        }

        .toast-error {
            background-color: #ef4444;
        }
    </style>
</head>

<body>

    <div id="toast"><i class="fas fa-info-circle mr-2"></i><span id="toastMsg">Message</span></div>

    <div class="auth-container">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-extrabold text-green-500 tracking-wide mb-2"><span
                    class="text-green-500">Abir</span> LTD</h2>
            <p class="text-gray-500 text-sm font-medium" id="formSubtitle">Sign in to your account</p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1.5 uppercase tracking-wider">Username</label>
                <div class="relative">
                    <i class="fas fa-user absolute left-3 top-3.5 text-gray-400"></i>
                    <input type="text" id="loginUsername" class="input-field pl-9" placeholder="Enter username"
                        required>
                </div>
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1.5 uppercase tracking-wider">Password</label>
                <div class="relative">
                    <i class="fas fa-lock absolute left-3 top-3.5 text-gray-400"></i>
                    <input type="password" id="loginPassword" class="input-field pl-9" placeholder="Enter password"
                        required>
                </div>
            </div>
            <button type="submit" id="loginBtn" class="btn-primary mt-2"><i class="fas fa-sign-in-alt mr-2"></i>
                Login</button>
            <a class="toggle-link" onclick="toggleView('register')">Don't have an account? Sign Up</a>
        </form>

        <form id="registerForm" class="hidden" onsubmit="handleRegister(event)">
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1.5 uppercase tracking-wider">Username</label>
                <input type="text" id="regUsername" class="input-field py-2" placeholder="Choose a username" required>
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1.5 uppercase tracking-wider">Password</label>
                <input type="password" id="regPassword" class="input-field py-2" placeholder="Create a password"
                    required minlength="6">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1.5 uppercase tracking-wider">Confirm
                    Password</label>
                <input type="password" id="regConfirmPassword" class="input-field py-2"
                    placeholder="Confirm your password" required minlength="6">
            </div>
            <button type="submit" id="registerBtn" class="btn-primary mt-2"><i class="fas fa-user-plus mr-2"></i> Create
                Account</button>
            <a class="toggle-link" onclick="toggleView('login')"><i class="fas fa-arrow-left mr-1"></i> Back to
                Login</a>
        </form>
    </div>

    <script>
        // যদি ইউজার আগে থেকেই লগইন করা থাকে, তবে সরাসরি ড্যাশবোর্ডে পাঠিয়ে দেবে
        if (localStorage.getItem('token')) {
            window.location.href = 'index.html';
        }

        let toastTimeout;
        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').textContent = msg;
            toast.className = isError ? 'toast-error toast-show' : 'toast-success toast-show';

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('toast-show');
            }, 3000);
        }

        // Login এবং Register ফর্মের মধ্যে সুইচ করার ফাংশন
        function toggleView(view) {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const subtitle = document.getElementById('formSubtitle');

            if (view === 'register') {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                subtitle.textContent = "Create a new employee account";
            } else {
                registerForm.classList.add('hidden');
                loginForm.classList.remove('hidden');
                subtitle.textContent = "Sign in to your account";
            }
        }

        // ================= LOGIN API CALL =================
        async function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('loginUsername').value;
            const p = document.getElementById('loginPassword').value;
            const btn = document.getElementById('loginBtn');

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Authenticating...';

            try {
                const res = await fetch('https://abir-backend-api.onrender.com/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, password: p })
                });
                const data = await res.json();

                if (res.ok) {
                    // টোকেন এবং ইউজারের ইনফো সেভ করা
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('username', data.user.username || u);
                    localStorage.setItem('role', data.user.role);

                    showToast("Login Successful! Redirecting...");
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 500);
                } else {
                    showToast(data.message || "Invalid username or password", true);
                }
            } catch (err) {
                showToast("Server error. Please try again later.", true);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt mr-2"></i> Login';
            }
        }

        // ================= REGISTER API CALL =================
        async function handleRegister(e) {
            e.preventDefault();
            const u = document.getElementById('regUsername').value;
            const p = document.getElementById('regPassword').value;
            const cp = document.getElementById('regConfirmPassword').value;
            const btn = document.getElementById('registerBtn');

            // পাসওয়ার্ড ম্যাচ করেছে কিনা চেক করা
            if (p !== cp) {
                showToast("Passwords do not match!", true);
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Creating Account...';

            try {
                // আপনার auth.js এর সাথে মিলিয়ে রিকোয়েস্ট পাঠানো হচ্ছে
                const res = await fetch('https://abir-backend-api.onrender.com/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, password: p })
                });

                const data = await res.json();

                if (res.ok) {
                    showToast(data.message || "Account created successfully! Please log in.");
                    document.getElementById('registerForm').reset();
                    toggleView('login');

                    // ইউজারের সুবিধার জন্য লগইন ফর্মে ইউজারনেম অটোমেটিক বসিয়ে দেওয়া
                    document.getElementById('loginUsername').value = u;
                    document.getElementById('loginPassword').focus();
                } else {
                    showToast(data.message || "Registration failed", true);
                }
            } catch (err) {
                showToast("Server error. Please try again later.", true);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-user-plus mr-2"></i> Create Account';
            }
        }
    </script>
</body>

</html>
