<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Abir Group</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-gray-100 flex items-center justify-center h-screen">

    <div class="bg-white p-8 rounded-lg shadow-lg w-96">
        <div class="text-center mb-6">
            <i class="fas fa-sun text-yellow-400 text-3xl mb-2"></i>
            <h2 class="text-2xl font-bold text-gray-800">Abir LTD</h2>
            <p class="text-sm text-gray-500">Please login to your account</p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="username">Username</label>
                <input
                    class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500"
                    id="username" type="text" placeholder="Enter username" required>
            </div>

            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="password">Password</label>
                <input
                    class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 mb-3 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500"
                    id="password" type="password" placeholder="Enter password" required>
            </div>

            <div class="flex items-center justify-between">
                <button
                    class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline w-full transition-colors"
                    type="submit" id="loginBtn">
                    Sign In
                </button>
            </div>
        </form>
    </div>

    <script>
        // API theke Login verify korar Javascript
        async function handleLogin(event) {
            event.preventDefault(); // Page jeno reload na hoy

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');

            loginBtn.innerText = "Checking...";
            loginBtn.disabled = true;

            try {
                // Backend API te request pathano
                const response = await fetch('https://abir-backend-api.onrender.com/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // Login success hole token save korbo LocalStorage e
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('username', data.user.username);
                    localStorage.setItem('role', data.user.role);

                    alert('Login Successful!');
                    window.location.href = 'index.html'; // Dashboard e niye jabe
                } else {
                    alert(data.message || 'Login Failed!');
                    loginBtn.innerText = "Sign In";
                    loginBtn.disabled = false;
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Server error! Ensure backend is running.');
                loginBtn.innerText = "Sign In";
                loginBtn.disabled = false;
            }
        }
    </script>
</body>

</html>
