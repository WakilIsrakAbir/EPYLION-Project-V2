<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Textile Planning Solution - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f4f5f7;
            background-image: url('Assets/login.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }

        .auth-container {
            background: white;
            padding: 2.5rem 2rem;
            border-radius: 8px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 400px;
        }

        .input-field {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            outline: none;
            margin-bottom: 1rem;
            font-size: 14px;
            color: #374151;
            background-color: #f9fafb;
            transition: all 0.2s;
        }

        .input-field:focus {
            border-color: #3b82f6;
            background-color: white;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .btn-primary {
            width: 100%;
            padding: 0.75rem;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-primary:hover {
            background-color: #2563eb;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-primary:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
            transform: none;
        }

        .toggle-link {
            color: #3b82f6;
            cursor: pointer;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            transition: color 0.2s;
        }

        .toggle-link:hover {
            color: #1d4ed8;
            text-decoration: underline;
        }

        #toast {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            padding: 1rem 1.5rem;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            transform: translateY(-20px);
            pointer-events: none;
            z-index: 50;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .toast-show {
            opacity: 1 !important;
            transform: translateY(0) !important;
        }

        .toast-success {
            background-color: #10b981;
        }

        .toast-error {
            background-color: #ef4444;
        }
    </style>
</head>

<body>



    <div id="toast"><i class="fas fa-info-circle mr-2"></i><span id="toastMsg">Message</span></div>

    <div class="auth-container">
        <div class="text-center mb-8">
            <div class="mb-5">
                <h2 class="text-3xl font-extrabold text-green-500 tracking-wide mb-2">Textile Planning Solution</h2>
                <p class="text-gray-800 text-sm font-medium">Developed by Wakil Israk Abir</p>
            </div>
            <p class="text-gray-500 text-sm font-medium" id="formSubtitle">Sign in to your account</p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1.5 uppercase tracking-wider">Username</label>
                <div class="relative">
                    <i class="fas fa-user absolute left-3 top-3.5 text-gray-400"></i>
                    <input type="text" id="loginUsername" class="input-field pl-9" placeholder="Enter username"
                        required>
                </div>
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1.5 uppercase tracking-wider">Password</label>
                <div class="relative">
                    <i class="fas fa-lock absolute left-3 top-3.5 text-gray-400"></i>
                    <input type="password" id="loginPassword" class="input-field pl-9 pr-10" placeholder="Enter password"
                        required>
                    <i class="fas fa-eye absolute right-3 top-3.5 text-gray-400 cursor-pointer hover:text-gray-600" id="togglePassword" onclick="togglePasswordVisibility()" title="Show/Hide Password"></i>
                </div>
            </div>
            <button type="submit" id="loginBtn" class="btn-primary mt-2"><i class="fas fa-sign-in-alt mr-2"></i>
                Login</button>
            
            <div class="text-center mt-5 text-sm text-gray-600 font-medium">
                You don't have account? <a href="https://www.linkedin.com/in/wakil-israk-abir/" target="_blank" class="text-blue-500 hover:text-blue-700 hover:underline">contact admin</a>
            </div>
        </form>
    </div>

    <script>
        if (localStorage.getItem('token')) {
            window.location.href = 'index.html';
        }

        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('loginPassword');
            const toggleIcon = document.getElementById('togglePassword');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        }

        let toastTimeout;
        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').textContent = msg;
            toast.className = isError ? 'toast-error toast-show' : 'toast-success toast-show';

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('toast-show');
            }, 3000);
        }

        async function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('loginUsername').value;
            const p = document.getElementById('loginPassword').value;
            const btn = document.getElementById('loginBtn');

            btn.disabled = true;
            btn.innerHTML = '<div class="inline-flex relative justify-center items-center w-4 h-4 mr-2 align-middle"><div class="absolute w-full h-full rounded-full border-2 border-white/30"></div><div class="absolute w-full h-full rounded-full border-2 border-transparent border-t-white border-r-white animate-spin"></div><div class="absolute w-2 h-2 rounded-full border-2 border-transparent border-b-white border-l-white animate-[spin_1.5s_linear_infinite_reverse]"></div></div> Authenticating...';

            try {
                const res = await fetch('https://abir-backend-api.onrender.com/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, password: p })
                });
                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('username', data.user.username || u);
                    localStorage.setItem('role', data.user.role);
                    
                    if (data.user.permissions) {
                        localStorage.setItem('permissions', JSON.stringify(data.user.permissions));
                    }
                    if (data.user.status) {
                        localStorage.setItem('status', data.user.status);
                    }

                    showToast("Login Successful! Redirecting...");
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 500);
                } else {
                    showToast(data.message || "Invalid username or password", true);
                }
            } catch (err) {
                showToast("Server error. Please try again later.", true);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt mr-2"></i> Login';
            }
        }
    </script>
</body>

</html>
