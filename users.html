<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users - Abir Group</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .custom-scrollbar::-webkit-scrollbar {
            height: 6px;
            width: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #9ca3af;
        }
    </style>
</head>

<body class="bg-gray-50 font-sans min-h-screen flex flex-col" onload="checkAdminAndLoadUsers()">

    <div id="toast"
        class="fixed top-5 right-5 bg-gray-800 text-white px-5 py-3 rounded-md shadow-lg transition-opacity duration-300 opacity-0 pointer-events-none z-50 flex items-center gap-3">
        <i class="fas fa-info-circle text-blue-400"></i>
        <span id="toastMessage">Action triggered</span>
    </div>

    <nav class="bg-gray-900 text-white p-4 flex justify-between items-center shadow-lg sticky top-0 z-40">
        <div class="flex items-center gap-4">
            <h1 class="text-xl font-bold tracking-wide"><i class="fas fa-users-cog text-blue-400 mr-2"></i> User
                Directory</h1>
            <a href="index.html"
                class="text-xs font-semibold bg-gray-700 px-3 py-1.5 rounded hover:bg-gray-600 transition flex items-center gap-1">
                <i class="fas fa-arrow-left"></i> Dashboard
            </a>
        </div>
        <div class="flex items-center gap-4">
            <div class="flex items-center gap-2 bg-gray-800 px-3 py-1 rounded-full border border-gray-700">
                <div class="w-6 h-6 rounded-full bg-blue-500 flex items-center justify-center text-xs"><i
                        class="fas fa-user"></i></div>
                <span class="text-xs font-medium text-gray-200" id="displayUsername">Loading...</span>
            </div>
            <button onclick="logout()" class="text-red-400 hover:text-red-500 transition" title="Logout">
                <i class="fas fa-sign-out-alt text-lg"></i>
            </button>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-4 gap-6 w-full flex-1">

        <div class="lg:col-span-1">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 sticky top-24">
                <div class="text-center mb-6">
                    <div
                        class="w-12 h-12 bg-green-100 text-green-600 rounded-full flex items-center justify-center text-xl mx-auto mb-3 shadow-inner">
                        <i class="fas fa-user-plus"></i>
                    </div>
                    <h2 class="text-lg font-bold text-gray-800">Create Account</h2>
                    <p class="text-xs text-gray-500 mt-1">Add a new employee to the system</p>
                </div>

                <form id="createUserForm" onsubmit="handleCreateUser(event)" class="space-y-4">
                    <div>
                        <label
                            class="block text-xs font-bold text-gray-700 mb-1 uppercase tracking-wide">Username</label>
                        <div class="relative">
                            <i class="fas fa-user absolute left-3 top-2.5 text-gray-400 text-sm"></i>
                            <input type="text" id="newUsername"
                                class="w-full border border-gray-300 rounded-md py-2 pl-9 pr-3 text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition bg-gray-50 focus:bg-white"
                                placeholder="e.g. abir_planner" required>
                        </div>
                    </div>
                    <div>
                        <label
                            class="block text-xs font-bold text-gray-700 mb-1 uppercase tracking-wide">Password</label>
                        <div class="relative">
                            <i class="fas fa-lock absolute left-3 top-2.5 text-gray-400 text-sm"></i>
                            <input type="text" id="newPassword"
                                class="w-full border border-gray-300 rounded-md py-2 pl-9 pr-3 text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition bg-gray-50 focus:bg-white"
                                placeholder="Set a default password" required>
                        </div>
                        <p class="text-[10px] text-gray-400 mt-1"><i class="fas fa-info-circle"></i> Save this password
                            to share with the user.</p>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1 uppercase tracking-wide">Role
                            Assignment</label>
                        <div class="relative">
                            <i class="fas fa-user-tag absolute left-3 top-2.5 text-gray-400 text-sm z-10"></i>
                            <select id="newRole"
                                class="w-full border border-gray-300 rounded-md py-2 pl-9 pr-3 text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition bg-gray-50 focus:bg-white appearance-none cursor-pointer relative z-0">
                                <option value="Viewer">Viewer (Read Only)</option>
                                <option value="Planner">Planner (Edit Data)</option>
                                <option value="Approver">Approver (Admin without Data Mgmt)</option>
                                <option value="Admin">Admin (Full Access)</option>
                            </select>
                            <i
                                class="fas fa-chevron-down absolute right-3 top-3 text-gray-400 text-xs pointer-events-none z-10"></i>
                        </div>
                    </div>
                    <button type="submit" id="createBtn"
                        class="w-full bg-blue-600 text-white font-bold py-2.5 rounded-md shadow-md hover:bg-blue-700 hover:shadow-lg transition-all flex items-center justify-center gap-2 mt-2">
                        <i class="fas fa-plus-circle"></i> Create User
                    </button>
                </form>
            </div>
        </div>

        <div class="lg:col-span-3 space-y-8" id="userDirectoryContainer">
            <div class="flex justify-center items-center h-40 text-gray-400">
                <i class="fas fa-spinner fa-spin text-3xl mr-3"></i> Loading Directory...
            </div>
        </div>
    </div>

    <script>
        let toastTimeout;
        function showToast(msg, isError = false) {
            const t = document.getElementById('toast');
            document.getElementById('toastMessage').textContent = msg;
            t.classList.remove('opacity-0', 'pointer-events-none');
            if (isError) {
                t.classList.replace('bg-gray-800', 'bg-red-600');
            } else {
                t.classList.replace('bg-red-600', 'bg-gray-800');
            }
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => t.classList.add('opacity-0', 'pointer-events-none'), 3000);
        }

        function checkAdminAndLoadUsers() {
            const token = localStorage.getItem('token');
            const role = localStorage.getItem('role');
            const username = localStorage.getItem('username');

            if (!token) { window.location.href = 'login.html'; return; }
            if (role !== 'Admin') {
                alert('Access Denied! Only Admins can manage users.');
                window.location.href = 'index.html';
                return;
            }

            document.getElementById('displayUsername').innerText = `${username} (${role})`;
            loadUsers();
        }

        async function loadUsers() {
            try {
                const response = await fetch('https://abir-backend-api.onrender.com/api/auth/users');
                const users = await response.json();

                const admins = users.filter(u => u.role === 'Admin');
                const approvers = users.filter(u => u.role === 'Approver');
                const planners = users.filter(u => u.role === 'Planner');
                const viewers = users.filter(u => u.role === 'Viewer');

                const container = document.getElementById('userDirectoryContainer');
                container.innerHTML = '';

                if (admins.length > 0) container.innerHTML += renderUserSection('Admin Management Team', admins, 'text-red-600', 'bg-red-50', 'border-red-200', 'fa-user-shield');
                if (approvers.length > 0) container.innerHTML += renderUserSection('Approvers', approvers, 'text-purple-600', 'bg-purple-50', 'border-purple-200', 'fa-user-check');
                if (planners.length > 0) container.innerHTML += renderUserSection('Planning & Operation Team', planners, 'text-blue-600', 'bg-blue-50', 'border-blue-200', 'fa-user-edit');
                if (viewers.length > 0) container.innerHTML += renderUserSection('Viewers & Observers', viewers, 'text-gray-600', 'bg-gray-100', 'border-gray-200', 'fa-eye');

                if (users.length === 0) {
                    container.innerHTML = `<div class="bg-white p-10 text-center rounded-xl shadow-sm border border-gray-200 text-gray-500"><i class="fas fa-users-slash text-4xl mb-3"></i><p>No users found in the system.</p></div>`;
                }

            } catch (error) {
                console.error('Error fetching users:', error);
                showToast("Failed to load users from server.", true);
            }
        }

        function renderUserSection(title, usersList, textColorClass, bgColorClass, borderColorClass, iconClass) {
            let html = `
            <div class="mb-8">
                <div class="flex items-center gap-3 mb-4 pl-1">
                    <div class="w-10 h-10 rounded-lg ${bgColorClass} ${textColorClass} flex items-center justify-center text-lg shadow-sm border ${borderColorClass}">
                        <i class="fas ${iconClass}"></i>
                    </div>
                    <h2 class="text-xl font-bold text-gray-800 tracking-tight">${title} <span class="text-sm font-medium text-gray-500 bg-gray-200 px-2 py-0.5 rounded-full ml-2">${usersList.length}</span></h2>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
            `;

            usersList.forEach(user => {
                const date = new Date(user.createdAt).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
                const displayPass = user.password || user.plainPassword || "Hidden (Hashed)";
                const isHidden = displayPass === "Hidden (Hashed)";

                html += `
                <div class="bg-white rounded-xl shadow-sm hover:shadow-md transition-shadow duration-200 border border-gray-200 overflow-hidden flex flex-col relative group">
                    <div class="p-4 flex-1">
                        <div class="flex justify-between items-start mb-3">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center text-gray-600 font-bold text-lg">
                                    ${user.username.charAt(0).toUpperCase()}
                                </div>
                                <div>
                                    <h3 class="font-bold text-gray-800 text-sm truncate max-w-[130px]" title="${user.username}">${user.username}</h3>
                                    <p class="text-[10px] text-gray-500"><i class="far fa-calendar-alt"></i> Joined: ${date}</p>
                                </div>
                            </div>
                            <span class="text-[10px] font-bold px-2 py-1 rounded-full ${bgColorClass} ${textColorClass} border ${borderColorClass}">
                                ${user.role}
                            </span>
                        </div>
                        
                        <div class="bg-gray-50 p-2.5 rounded border border-gray-100 mt-2 relative">
                            <p class="text-[10px] font-bold text-gray-500 uppercase mb-1">User Password</p>
                            <div class="flex items-center justify-between">
                                <code class="text-xs font-mono text-gray-800 tracking-wide">${displayPass}</code>
                                ${!isHidden ? `<button onclick="copyToClipboard('${displayPass}')" class="text-gray-400 hover:text-blue-500 transition p-1" title="Copy Password"><i class="far fa-copy"></i></button>` : ''}
                            </div>
                        </div>
                    </div>
                    
                    <button onclick="deleteUser('${user._id}', '${user.username}')" class="absolute top-3 right-3 bg-red-100 text-red-500 w-8 h-8 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-200 hover:bg-red-500 hover:text-white shadow-sm" title="Delete User">
                        <i class="fas fa-trash-alt text-sm"></i>
                    </button>
                </div>
                `;
            });

            html += `</div></div>`;
            return html;
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                showToast("Password copied to clipboard!");
            }).catch(err => {
                showToast("Failed to copy!", true);
            });
        }

        async function handleCreateUser(event) {
            event.preventDefault();
            const username = document.getElementById('newUsername').value;
            const password = document.getElementById('newPassword').value;
            const role = document.getElementById('newRole').value;
            const btn = document.getElementById('createBtn');

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating...';

            try {
                const response = await fetch('https://abir-backend-api.onrender.com/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, role })
                });

                const data = await response.json();
                if (response.ok) {
                    showToast('User Created Successfully!');
                    document.getElementById('createUserForm').reset();
                    loadUsers();
                } else {
                    showToast(data.message || 'Failed to create user.', true);
                }
            } catch (error) {
                console.error('Error:', error);
                showToast("Server error during creation.", true);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-plus-circle"></i> Create User';
            }
        }

        async function deleteUser(userId, username) {
            if (confirm(`Are you absolutely sure you want to delete '${username}'? This action cannot be undone.`)) {
                try {
                    const response = await fetch(`https://abir-backend-api.onrender.com/api/auth/user/${userId}`, {
                        method: 'DELETE'
                    });

                    if (response.ok) {
                        showToast('User deleted successfully!');
                        loadUsers();
                    } else {
                        showToast('Failed to delete user.', true);
                    }
                } catch (error) {
                    console.error('Error deleting user:', error);
                    showToast('Server error during deletion.', true);
                }
            }
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'login.html';
        }
    </script>
</body>

</html>
